<!DOCTYPE html>

<head>

  <!-- font links -->
  <title>MAZLICKOF</title>

</head>

<body>

  <div class="container">
    <style>
      body {
        margin: 0;
        padding: 0;
      }

      @font-face {

        src: url(./Cera-Pro.woff/Demo_Fonts.woff/Fontspring-DEMO-cerapro-light.otf);
        font-weight: 300;
      }

      @font-face {

        src: url(./Cera-Pro.woff/Demo_Fonts.woff/Fontspring-DEMO-cerapro-bold.otf);
        font-weight: 700;
      }

      @font-face {
        font-family: gilroy;
        src: url(./gilroy-font.woff/Gilroy.woff/Gilroy-ExtraBold.otf);
        font-weight: 700;
      }

      @font-face {
        font-family: gilroy;
        src: url(./gilroy-font.woff/Gilroy.woff/Gilroy-Light.otf);
      }
    </style>
    <!-- announcment bar -->

        <p style="text-align: center;"> CHRISTMAS DELIVERY GUARANTEE FOR ORDERS </p>

          <p class="phone-number"> +420 736 603 917&nbsp; |&nbsp; info@mazlickof.cz </p>
        </div>
      </div>
    </section>
    <!--header section -->
    <section class="headerSection">
      <div class="header">
        <div class="item1">
          <div class="socialmedia3"><img src="Vector3.png" alt="logo" class="margin-left" width="25px" height="25px">
          </div>
          <div class="socialmedia2"><img src="Vector2.png" alt="logo" class="margin-left" width="25px" height="25px">
          </div>
          <div class="socialmedia1"><img src="Vector1.png" alt="logo" class="margin-left" width="25px" height="25px">

        <div class="logotime"> <img class="logo" src="image 1.svg" alt="the logo" class="center"> </div>

          </div>
          <div class="icon2"><img src="search.png" alt="logo" class="margin-left" width="25px" height="25px">
          </div>
          <div class="icon3"><img src="Group.png" alt="logo" class="margin-left" width="23.5px" height="24px">
          </div>
        </div>




      </div>

      <div class="nav">

          <ul>
            <li><a href="#home">Start creating</a></li>
            <li><a href="#news">How to do </a></li>
            <li><a href="#contact">FAQ </a></li>
            <li><a href="#about">Contact</a></li>
            <li><a href="#about">About Us</a></li>
            <li><a href="#about">Review</a></li>
          </ul>
        </nav>
      </div>
    </section>
    <!-- hero section -->
    <section class="herosection">
      <div class="home">
        <p class=now>Now live</p>
        <h1 style="text-align: center"> WELCOME TO MAZLICKOF </h1>

      </div>
      <div>
        <div class="thebutton">

        </div>
        <img class="hero" src="img2.png" class="center" </section>
        <style>
          .now {
            font-family: "gilroy";
            font-size: 25px;
            font-weight: 300;
            text-align: center;
            margin-top: 78px;
            margin-bottom: 0;
            color: #000000;
          }

          .custom {
            font-family: "gilroy";
            font-optical-sizing: auto;
            font-style: normal;
            margin: 0;
            font-size: 20px;
            font-weight: 300;
            text-align: center;
            margin-bottom: 53px;
            color: gray;
          }

          h1 {
            font-family: "Cerapro";
            font-size: 60px;
            font-weight: 700;
            font-style: normal;
            margin-top: auto;
            margin: 0;
          }


          .item1 {
            display: flex;
            justify-content: left;
            flex-direction: row-reverse;
            gap: 18px;
            
          }

          .item2 {

            justify-content: right;
            flex-direction: row-reverse;
            gap: 18px;
            padding-top: 10%;

            height: auto;
            align-items: center;
            height: auto;

            justify-content: center;
            margin-top: 48px;
            margin-bottom: 34px;
          }

          button {

            height: 73px;
            padding-top: auto;
            padding-bottom: auto;
            font-size: 20px;
            font: weight 800px;
            color: white;
            border-radius: 25px;
            background-color: #8DCAC8;
            cursor: pointer;
            position: relative;
            border: none;
            font-family: "gilroy";
            font-weight: 800;
            margin-bottom: 30px;

          }



          .home {
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            margin-top: auto;
            grid-template-columns: min-content;
          }

          .nav {
            display: flex;
            justify-content: center;
           
          }

          ul {
            list-style: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: white;
            display: flex;
            gap: auto;
            max-width: 100%;
          }

          ul li a {
            display: block;
            color: black;
            font-family: "Cerapro";
            font-weight: 700;
            text-align: center;
            font-size: 20px;
            padding: 14px 16px;
            text-decoration: none;
          }

          .header {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            margin-left: 40px;
            margin-right: 40px;
          }

          .container {
            max-width: 100%;

            height: auto;
            background: white;

          }

          .announcement {
            display: flex;
            max-width: 100%;
            justify-content: center;
            align-items: center;
            background: #FF97AB;
            color: white;
            font-family: "gilroy";
            font-optical-sizing: auto;
            font-weight: 700;
            font-style: normal;
            height: 43px;
            font-size: 15px;
            position: relative;



           }

          .announcement-bar-content {
            font-family: "gilroy";
            font-size: 15px;
            font-weight: 700;
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translate(0, -50%);
          }

          .logotime {
            display: flex;
            justify-content: center;
            padding-left: auto;
            padding-right: auto;

          }

          .socialmedia1 {
            display: left;
            margin-top: 30px;
            border-left: 169px;
          }

          .socialmedia2 {
            display: left;
            margin-top: 30px;
            border-left: 169px;
          }

          .socialmedia3 {
            display: left;
            padding: left 83px;
            margin-top: 30px;
            border-left: 169px;
          }

          @media screen and (max-width: 990px) {
            .announcement-bar-content {
              display:none;
            }

            .item2 {
              display: none;
            }
            .item1{
              display: none;
            }
            .hero{
              
              margin-bottom: 0px;
              margin-top: 0px;

            }

          }
